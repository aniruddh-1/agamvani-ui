name: Deploy Frontend Container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agamvani-ui-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.TAILSCALE_SERVER_IP }}
  DEPLOY_USER: deploy
  DEPLOY_ROOT: /opt/agamvani-platform/agamvani-ui
  IMAGE: agamvani-ui:${{ github.sha }}
  HOST_PORT: "3001"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Build and audit
        env:
          VITE_API_ROOT_URL: ${{ secrets.VITE_API_ROOT_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}"
          : "${VITE_FRONTEND_URL:?VITE_FRONTEND_URL is required}"
          : "${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}"
          npm ci --no-fund --no-audit --legacy-peer-deps
          npm run build
          npm audit --audit-level=high
          docker build --tag "$IMAGE" .
          docker save "$IMAGE" | gzip -9 > ui-image.tar.gz

      - name: Generate site configuration
        env:
          SERVER_IP: ${{ secrets.TAILSCALE_SERVER_IP }}
          DOMAIN_NAME: av.ramsabha.in
          STATIC_FILES_PATH: /opt/agamvani-platform/agamvani-ui/dist
          BACKEND_HOST: 127.0.0.1
          BACKEND_PORT: "8002"
          UI_CONTAINER_HOST: 127.0.0.1
          UI_CONTAINER_PORT: "3001"
          DEPLOYMENT_TYPE: domain-server
          SSL_CERT_PATH: /etc/letsencrypt/live/av.ramsabha.in/fullchain.pem
          SSL_KEY_PATH: /etc/letsencrypt/live/av.ramsabha.in/privkey.pem
          SSL_CHAIN_PATH: /etc/letsencrypt/live/av.ramsabha.in/chain.pem
        run: |
          set -euo pipefail
          envsubst '$SERVER_IP,$DOMAIN_NAME,$STATIC_FILES_PATH,$BACKEND_HOST,$BACKEND_PORT,$UI_CONTAINER_HOST,$UI_CONTAINER_PORT,$DEPLOYMENT_TYPE,$SSL_CERT_PATH,$SSL_KEY_PATH,$SSL_CHAIN_PATH' \
            < nginx-server.conf > agamvani-site.conf
          nginx -t -c "$PWD/nginx-main.conf" -p "$PWD" 2>/dev/null || true

      - name: Load SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Connect Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.92.3

      - name: Configure verified SSH host
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS is required}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 0600 ~/.ssh/config

      - name: Upload staged release
        run: scp ui-image.tar.gz agamvani-site.conf production:/tmp/

      - name: Activate with rollback
        run: |
          ssh production "sudo -n env COMMIT_SHA='${{ github.sha }}' DEPLOY_ROOT='${DEPLOY_ROOT}' HOST_PORT='${HOST_PORT}' bash -se" <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null
          docker network inspect agamvani-network >/dev/null 2>&1 || docker network create agamvani-network >/dev/null
          command -v nginx >/dev/null
          test -f /etc/letsencrypt/live/av.ramsabha.in/fullchain.pem
          test -f /etc/letsencrypt/live/av.ramsabha.in/privkey.pem

          install -d -m 0750 "${DEPLOY_ROOT}/releases/${COMMIT_SHA}"
          docker load < /tmp/ui-image.tar.gz >/dev/null
          site=/etc/nginx/sites-available/agamvani-platform
          site_backup="${DEPLOY_ROOT}/releases/${COMMIT_SHA}/agamvani-site.previous"
          if [ -f "$site" ]; then
            cp --preserve=mode,ownership,timestamps "$site" "$site_backup"
          fi
          install -m 0644 /tmp/agamvani-site.conf "$site"
          ln -sfn "$site" /etc/nginx/sites-enabled/agamvani-platform
          nginx -t

          rollback_name="agamvani-ui-rollback-${COMMIT_SHA}"
          had_previous=false
          if docker container inspect agamvani-ui >/dev/null 2>&1; then
            docker stop agamvani-ui >/dev/null
            docker rename agamvani-ui "$rollback_name"
            had_previous=true
          fi

          rollback() {
            docker rm -f agamvani-ui >/dev/null 2>&1 || true
            if [ "$had_previous" = true ]; then
              docker rename "$rollback_name" agamvani-ui
              docker start agamvani-ui >/dev/null
            fi
            if [ -f "$site_backup" ]; then
              install -m 0644 "$site_backup" "$site"
              nginx -t && systemctl reload nginx
            fi
          }
          trap rollback ERR

          docker run -d \
            --name agamvani-ui \
            --restart unless-stopped \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=32m \
            --network agamvani-network \
            -p "127.0.0.1:${HOST_PORT}:8080" \
            "agamvani-ui:${COMMIT_SHA}" >/dev/null

          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${HOST_PORT}/health" >/dev/null; then
              nginx -t
              systemctl reload nginx
              ln -sfn "${DEPLOY_ROOT}/releases/${COMMIT_SHA}" "${DEPLOY_ROOT}/current"
              trap - ERR
              exit 0
            fi
            sleep 3
          done
          docker logs --tail=100 agamvani-ui
          false
          REMOTE

      - name: Remove only staged files
        if: always()
        run: |
          rm -f ui-image.tar.gz agamvani-site.conf
          ssh production "sudo -n rm -f /tmp/ui-image.tar.gz /tmp/agamvani-site.conf" || true
